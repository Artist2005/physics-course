<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 · Page Not Found · physics.sheua.com</title>
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Google+Sans+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-paper: #f4f2ed;
      --bg-page: #faf9f5;
      --bg-inset: #efeae0;
      --ink-primary: #18181b;
      --ink-secondary: #3f3f46;
      --ink-muted: #52525b;
      --rule-dark: #d6d3cd;
      --accent-crimson: #991b1b;
      --font-sans: "Google Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: "Google Sans Mono", monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg-paper); color: var(--ink-primary); font-family: var(--font-sans); line-height: 1.65; padding: 36px 16px; }
    .skip-link { position: fixed; top: -60px; left: 12px; z-index: 9999; padding: 8px 12px; background: #18181b; color: #faf9f5; font-size: 13px; font-weight: 600; text-decoration: none; border-radius: 3px; }
    .skip-link:focus { top: 12px; }
    :where(a, input):focus-visible { outline: 2px solid #1d4ed8; outline-offset: 2px; }
    main { max-width: 680px; margin: 0 auto; background: var(--bg-page); border: 1px solid var(--rule-dark); padding: 32px 28px; }
    .code { font-family: var(--font-mono); font-size: 12px; color: var(--ink-muted); margin-bottom: 8px; }
    h1 { font-size: 28px; line-height: 1.25; margin-bottom: 10px; }
    p { font-size: 15px; color: var(--ink-secondary); margin-bottom: 14px; }
    .search-input { width: 100%; padding: 9px 12px; border: 1px solid var(--rule-dark); border-radius: 3px; background: var(--bg-paper); font-family: var(--font-sans); font-size: 14.5px; color: var(--ink-primary); margin-bottom: 12px; }
    .results-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; margin-bottom: 16px; }
    .res-chip { display: block; padding: 8px 11px; border: 1px solid var(--rule-dark); border-radius: 3px; background: var(--bg-paper); color: var(--ink-primary); font-size: 13.5px; font-weight: 600; text-decoration: none; }
    .res-chip:hover { border-color: var(--ink-primary); color: var(--accent-crimson); background: var(--bg-inset); }
    .links { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--rule-dark); }
    .links a { color: var(--accent-crimson); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; font-size: 13.5px; }
      sub, sup { font-size: 0.75em; line-height: 0; position: relative; vertical-align: baseline; }
    sub { bottom: -0.22em; }
    sup { top: -0.38em; }
      @media (pointer: coarse), (max-width: 820px) { .res-chip, .search-input { min-height: 44px; display: flex; align-items: center; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
  
    /* baseline-ui typography, tabular numerals & safe-area polish */
    h1, h2, h3 { text-wrap: balance; }
    p, li { text-wrap: pretty; }
    code, table, td, th, .kpi-pill, .formula-block, .calc-val, .calc-result, .sandbox-readout, .quiz-score, .stat-num {
      font-variant-numeric: tabular-nums;
    }
    body {
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      padding-bottom: max(56px, env(safe-area-inset-bottom, 0px));
    }
  </style>
  <script id="sheua-sub-helper">window.__subH=function(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\bS_N([12])\b/g,'S<sub>N</sub>$1').replace(/([A-Za-zА-ЯІЇЄҐа-яіїєґ0-9ΔΩα-ωΑ-Ω⁰¹²³⁴⁵⁶⁷⁸⁹⁺⁻)\]′⟨⟩]+)_([A-Za-zА-ЯІЇЄҐа-яіїєґ0-9α-ωΑ-Ω+\-′⟨⟩⊕]+(?:[,-][A-Za-zА-ЯІЇЄҐа-яіїєґ0-9α-ωΑ-Ω+\-]+)*)/g,function(m,b,d){return /^(chem|bio|sim|sheua|http|https|data|aria)$/i.test(b)?m:(b+'<sub>'+d+'</sub>');});};</script>
</head>
<body>
  <a class="skip-link" id="skip-404" href="#main-content">Skip to main content</a>
  <main id="main-content">
    <div class="code">HTTP 404 · physics.sheua.com</div>
    <h1 id="h1-404">Page not found</h1>
    <p id="p-404">The requested simulation address was not found. Filter 3D experiments below or open a discipline hub.</p>
    <input type="search" id="q-404" class="search-input" placeholder="Search 3D lab: collision, pendulum, lens, Carnot, titration, PCR..." aria-label="Search 3D simulations" autocomplete="off" />
    <div id="res-404" class="results-grid"></div>
    <nav class="links" aria-label="Site navigation">
      <a href="/">3D Lab · English</a>
      <a href="/uk/">3D-лабораторія · УКР</a>
      <a href="https://sheua.com/">Підручник і НМТ</a>
      <a href="https://sheua.com/en/calculators.html">SI Calculators</a>
      <a href="/about.html">About &amp; Contact</a>
    </nav>
  </main>
  <script>
    (function(){
      var isUk = /^\/uk(\/|$)/i.test(location.pathname);
      var p = isUk ? '/uk/sim/' : '/sim/';
      var SIMS = [
        { k: 'collision', uk: '§ 1. Зіткнення куль та імпульс', en: '§ 1. Momentum & Collisions' },
        { k: 'pendulum', uk: '§ 3. Математичний маятник', en: '§ 3. Simple & Spring Pendulum' },
        { k: 'archimedes', uk: '§ 7. Закон Архімеда', en: '§ 7. Archimedes Buoyancy' },
        { k: 'gas', uk: '§ 8. Ідеальний газ під поршнем', en: '§ 8. Ideal Gas Piston' },
        { k: 'lens', uk: '§ 14. Збиральна лінза', en: '§ 14. Converging Lens Optics' },
        { k: 'faraday', uk: '§ 16. Індукція Фарадея', en: '§ 16. Faraday Induction' },
        { k: 'carnot', uk: '§ 23. Цикл Карно', en: '§ 23. Carnot Heat Engine' },
        { k: 'chem_orbitals', uk: '§ Х-1. Атомні 3D-орбіталі', en: '§ C-1. Quantum 3D Orbitals' },
        { k: 'chem_vsepr', uk: '§ Х-2. Молекулярна геометрія ГЕПВО', en: '§ C-2. VSEPR Molecular Geometry' },
        { k: 'chem_titration', uk: '§ Х-7. Титрування та pH', en: '§ C-7. Acid-Base Titration & pH' },
        { k: 'bio_eukaryote', uk: '§ Б-01. Еукаріотична клітина', en: '§ B-01. Eukaryotic Cell Organelles' },
        { k: 'bio_crispr', uk: '§ Б-17. Редагування CRISPR-Cas9', en: '§ B-17. CRISPR-Cas9 Gene Editing' }
      ];
      var inp = document.getElementById('q-404');
      var box = document.getElementById('res-404');
      if (isUk) {
        document.documentElement.lang = 'uk';
        document.title = '404 · Сторінку не знайдено · physics.sheua.com';
        document.getElementById('skip-404').textContent = 'Перейти до основного змісту';
        document.getElementById('h1-404').textContent = 'Сторінку не знайдено';
        document.getElementById('p-404').textContent = 'Запитану адресу не знайдено. Знайдіть потрібний 3D-дослід нижче або відкрийте головний каталог.';
        inp.placeholder = 'Пошук 3D-досліду: імпульс, маятник, лінза, Карно, pH, ДНК...';
        inp.setAttribute('aria-label', 'Пошук 3D-досліду');
      }
      function draw(q) {
        var term = (q || '').trim().toLowerCase();
        var list = SIMS.filter(function(s){
          return !term || s.k.indexOf(term) !== -1 || s.uk.toLowerCase().indexOf(term) !== -1 || s.en.toLowerCase().indexOf(term) !== -1;
        });
        if (!list.length) list = SIMS.slice(0, 6);
        box.innerHTML = list.slice(0, 6).map(function(s){
          return '<a class="res-chip" href="' + p + s.k + '">' + (isUk ? s.uk : s.en) + ' →</a>';
        }).join('');
      }
      var slugGuess = decodeURIComponent(location.pathname.split('/').pop() || '').replace(/\.html$/i, '').replace(/[-_]+/g, ' ').trim();
      if (slugGuess && slugGuess !== '404') inp.value = slugGuess;
      inp.addEventListener('input', function(){ draw(inp.value); });
      draw(inp.value);
    })();
  </script>
</body>
</html>
