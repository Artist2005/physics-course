services:
  physics-3d-course:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: physics-3d-course
    restart: unless-stopped
    environment:
      - PORT=8080
    ports:
      - "80:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
