server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/physics-course;
    index index.html;
    charset utf-8;

    # Стиснення Gzip для швидкого завантаження 3D-рушія та сторінок
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/html
        text/javascript
        text/xml
        application/javascript
        application/json
        application/ld+json
        application/xml
        image/svg+xml;

    # Заголовки безпеки
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Перевірка стану сервера
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Кешування спільних скриптів, стилів та іконок
    location ~* \.(css|js|svg|ico|png|jpg|jpeg|webp)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Роздача всіх 94 сторінок експериментів та чистих URL (/sim/archimedes або /sim/archimedes.html)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/ /index.html;
    }
}
