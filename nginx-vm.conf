server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/physics-course;
    index index.html;
    charset utf-8;

    # Стиснення Gzip та роздача попередньо стиснених .gz файлів
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/html
        text/javascript
        text/xml
        application/javascript
        application/json
        application/ld+json
        application/xml
        image/svg+xml;

    # Заголовки безпеки на рівні сервера
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Перевірка стану сервера
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Кешування спільних скриптів, стилів, шрифтів та іконок
    location ~* \.(css|js|svg|ico|png|jpg|jpeg|webp|woff2|woff|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri =404;
    }

    error_page 404 /404.html;

    location = /ads.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files /ads.txt =404;
    }

    # BEGIN SHEUA SEO REDIRECTS
    rewrite ^/sim/brewster(\.html)?$ https://physics.sheua.com/sim/malus permanent;
    rewrite ^/uk/sim/brewster(\.html)?$ https://physics.sheua.com/uk/sim/malus permanent;
    rewrite ^/sim/chem_arrhenius(\.html)?$ https://physics.sheua.com/sim/chem_orders permanent;
    rewrite ^/uk/sim/chem_arrhenius(\.html)?$ https://physics.sheua.com/uk/sim/chem_orders permanent;
    if ($request_uri ~ ^/(uk/)?sim/([^/.?]+)\.html(\?.*)?$) {
        return 301 https://physics.sheua.com/$1sim/$2$is_args$args;
    }
    if ($request_uri ~ ^/(uk/)?index\.html(\?.*)?$) {
        return 301 https://physics.sheua.com/$1$is_args$args;
    }
    # END SHEUA SEO REDIRECTS

    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Роздача всіх сторінок експериментів та чистих URL (/sim/archimedes або /sim/archimedes.html)
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri $uri.html $uri/ =404;
    }
}
