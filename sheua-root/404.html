    .res-chip { display: block; padding: 8px 11px; border: 1px solid var(--rule-dark); border-radius: 3px; background: var(--bg-paper); color: var(--ink-primary); font-size: 13.5px; font-weight: 600; text-decoration: none; }
    .res-chip:hover { border-color: var(--ink-primary); color: var(--accent-crimson); background: var(--bg-inset); }
    .links { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--rule-dark); }
    .links a { color: var(--accent-crimson); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; font-size: 13.5px; }

  <script>
    (function(){
      var isEn = /^\/en(\/|$)/i.test(location.pathname);
      var ITEMS = isEn ? [
        { t: 'Overview & Live Sandbox', k: 'home overview textbook', u: '/en/' },
        { t: 'AP, IB & GCSE Exam Quiz', k: 'exam quiz test practice', u: '/en/exam-practice.html' },
        { t: 'SI Formula Calculators', k: 'calculator formula collision lens gas ph', u: '/en/calculators.html' },
        { t: '3D Physics Lab · 46 Sims', k: 'physics mechanics optics carnot pendulum', u: 'https://physics.sheua.com/' },

        { t: '3D Biology Lab · 20 Sims', k: 'biology cell dna pcr crispr neuron', u: 'https://physics.sheua.com/sim/bio_eukaryote' }
      ] : [
        { t: 'Тренажер НМТ · 15 завдань', k: 'нмт тест тренажер зно', u: '/nmt-trener.html' },
        { t: 'Лабораторні роботи 7-11 клас', k: 'лабораторні 7 8 9 10 11 клас школа', u: '/laboratorni-7-11-klas.html' },
        { t: 'Калькулятори формул СІ', k: 'калькулятор формули удар лінза газ маятник ph', u: '/kalkuliatory.html' },
        { t: 'І. Механіка і закони збереження', k: 'механіка імпульс енергія обертання', u: '/mechanics-conservation.html' },
        { t: 'ІІ. Гідродинаміка і термодинаміка', k: 'бернуллі архімед газ карно термодинаміка', u: '/thermodynamics-fluids.html' },
        { t: 'ІІІ. Оптика, електродинаміка і кванти', k: 'оптика лінза інтерференція фарадей фотоефект', u: '/optics-electromagnetism.html' },
        { t: 'IV. Квантова хімія і зв\'язок', k: 'хімія орбіталі гепво кристали', u: '/quantum-chemistry-bonding.html' },
        { t: 'V. Кінетика, рівновага і pH', k: 'кінетика рівновага буфер електроліз нернст', u: '/chemical-kinetics-equilibrium.html' },
        { t: 'VI. Клітина, ДНК, ПЛР і CRISPR', k: 'біологія клітина мітоз днк плр crispr', u: '/cell-molecular-biology.html' },
        { t: 'VII. Біофізика мембран і судин', k: 'біофізика нейрон око судини гемодинаміка', u: '/biophysics-physiology.html' },

      ];
      var inp = document.getElementById('q-404');
      var box = document.getElementById('res-404');
      if (isEn) {
        document.documentElement.lang = 'en';
        document.title = '404 · Page Not Found · SHEUA.COM';
        document.getElementById('skip-404').textContent = 'Skip to main content';
        document.getElementById('h1-404').textContent = 'Page not found';
        document.getElementById('p-404').textContent = 'The requested address was not found. Search below or choose a section to continue.';
        inp.placeholder = 'Search: calculator, quiz, physics, chemistry, DNA...';
        inp.setAttribute('aria-label', 'Search portal sections');
      }
      function draw(q) {
        var term = (q || '').trim().toLowerCase();
        var list = ITEMS.filter(function(it){
          return !term || it.t.toLowerCase().indexOf(term) !== -1 || it.k.indexOf(term) !== -1;
        });
        if (!list.length) list = ITEMS.slice(0, 6);
        box.innerHTML = list.slice(0, 6).map(function(it){
          return '<a class="res-chip" href="' + it.u + '">' + it.t + ' →</a>';
        }).join('');
      }
      var slugGuess = decodeURIComponent(location.pathname.split('/').pop() || '').replace(/\.html$/i, '').replace(/[-_]+/g, ' ').trim();
      if (slugGuess && slugGuess !== '404') inp.value = slugGuess;
      inp.addEventListener('input', function(){ draw(inp.value); });
      draw(inp.value);
    })();
  </script>
